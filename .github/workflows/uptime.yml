# Watches the live site from outside our own infrastructure.
#
# This runs on GitHub, not on the Proxmox box, and reaches the site the way a
# customer does — DNS, Cloudflare, the tunnel, the app. That independence is
# the whole point: in September the site was unreachable for two weeks while
# every check running *inside* the container reported itself perfectly
# healthy. A watchman standing in the building he is guarding cannot tell you
# that it has burned down.
#
# Secrets required: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.

name: uptime

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Also send a test message, to prove the alarm still reaches a phone'
        type: boolean
        default: false

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # An alarm nobody has heard in months is not an alarm. A bot token can be
      # revoked, a chat can be deleted, a secret can be rotated in one place and
      # not the other — and every one of those failures is silent until the day
      # it matters. This makes the wire checkable on demand.
      - name: Prove the alarm still works
        if: inputs.test_alert
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "::error::No Telegram secrets are set; the alarm is silent."
            exit 1
          fi

          cat > message.txt <<'EOF'
          🔔 shiba.pw uptime — test message

          The external watchman can still reach this chat.
          Nothing is wrong; this run was started by hand.
          EOF

          code=$(curl -sS --max-time 20 -o response.json -w '%{http_code}' \
            -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT}" \
            -d disable_web_page_preview=true \
            --data-urlencode "text@message.txt")

          if [ "$code" != "200" ]; then
            echo "::error::Telegram refused the test message (HTTP $code)."
            cat response.json
            exit 1
          fi

          echo "Telegram accepted the test message."

      - name: Probe the public site
        run: |
          : > failures.txt

          fetch() {
            curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
                 -A 'shiba-uptime (+https://shiba.pw)' "$1" 2>/dev/null || echo 000
          }

          # A check is only believed after it has failed twice, twenty seconds
          # apart. A single timeout is weather, not an outage, and an alert
          # that cries wolf gets muted — which costs more than it saves.
          probe() {
            label="$1"; url="$2"; mode="$3"; shift 3
            for attempt in 1 2; do
              code=$(fetch "$url" "$mode")
              for want in "$@"; do
                if [ "$code" = "$want" ]; then
                  echo "ok    $label ($code)"
                  return 0
                fi
              done
              [ "$attempt" = 1 ] && sleep 20
            done
            echo "FAIL  $label — wanted $*, got $code"
            printf '• %s — wanted %s, got %s\n' "$label" "$*" "$code" >> failures.txt
          }

          # The health endpoint, then the page a visitor actually lands on.
          probe 'health endpoint' 'https://shiba.pw/up' direct 200
          probe 'home page' 'https://shiba.pw/' follow 200

          # A real customer's QR code is printed and hanging in their showroom.
          # It cannot be reissued, so it is checked by name, every time.
          # Not followed: lnk.bio's own availability is not our outage.
          probe 'showroom short link (a printed customer QR)' 'https://go.shiba.pw/vpZyOWOn' direct 302 200

          # Certificates expire quietly and take the whole site with them.
          expiry=$(echo | openssl s_client -servername shiba.pw -connect shiba.pw:443 2>/dev/null \
                     | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
          if [ -n "$expiry" ]; then
            days=$(( ( $(date -d "$expiry" +%s) - $(date +%s) ) / 86400 ))
            echo "info  TLS certificate expires in $days days"
            if [ "$days" -lt 10 ]; then
              printf '• TLS certificate expires in %s days\n' "$days" >> failures.txt
            fi
          fi

          if [ -s failures.txt ]; then
            echo "BROKEN=1" >> "$GITHUB_ENV"
          fi

      - name: Raise the alarm
        if: env.BROKEN == '1'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat failures.txt

          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "::error::shiba.pw is failing its external probe, and no Telegram secrets are set."
            exit 1
          fi

          {
            printf '🚨 shiba.pw is unreachable from the internet\n\n'
            cat failures.txt
            printf '\nChecked from GitHub, outside our own network.\n'
          } > message.txt

          curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT}" \
            -d disable_web_page_preview=true \
            --data-urlencode "text@message.txt" > /dev/null

          echo "::error::shiba.pw failed its external probe; Telegram was notified."
          exit 1
